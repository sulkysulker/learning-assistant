name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Ruff
        working-directory: backend
        run: ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend/learning-assistant
        run: npm install
      - name: Run ESLint
        working-directory: frontend/learning-assistant
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create CI environment file
        shell: bash
        run: |
          cat > backend/.env <<'EOF'
          SECRET_KEY=ci-placeholder-secret-key
          GEMINI_API_KEY=ci-placeholder-gemini-api-key
          EOF
      - name: Build Docker images
        run: docker compose build
